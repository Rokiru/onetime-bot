<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080f17">
  <title>Искра: Последний свет</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="arena" aria-label="Игровая арена"></canvas>
  <main id="menu" class="screen">
    <header class="brand"><span><b class="brand-mark">✦</b> ИСКРА <i>/ 01</i></span><span class="pill"><em></em> ОФЛАЙН</span></header>
    <div class="hero-copy"><div class="eyebrow">СОХРАНИ ТО, ЧТО ОСТАЛОСЬ</div><h1>ИСКРА<span>ПОСЛЕДНИЙ СВЕТ</span></h1><p>Тьма наступает.<br>Одной искры достаточно.</p></div>
    <div class="hero-art" aria-hidden="true"><svg viewBox="0 0 300 240"><defs><radialGradient id="glow"><stop stop-color="#ffbe72" stop-opacity=".32"/><stop offset="1" stop-color="#ffbe72" stop-opacity="0"/></radialGradient><linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe0a9"/><stop offset="1" stop-color="#f08038"/></linearGradient></defs><circle cx="150" cy="122" r="116" fill="url(#glow)"/><g fill="none" stroke="#ffb85c"><ellipse cx="150" cy="141" rx="116" ry="43" opacity=".15"/><ellipse cx="150" cy="141" rx="85" ry="31" opacity=".27"/><ellipse cx="150" cy="141" rx="52" ry="20" opacity=".45"/></g><path d="M150 40 L185 100 L150 159 L115 100Z" fill="url(#gem)"/><path d="M150 40V159L115 100Z" fill="#fff2ca" opacity=".55"/><path d="M150 69L165 99L150 127L135 99Z" fill="#fff6dc"/><path d="M150 161V195M95 100H74M205 100H226" stroke="#ffb85c" opacity=".5"/><circle cx="75" cy="89" r="3" fill="#61e4cf"/><circle cx="232" cy="148" r="3" fill="#ff687e"/><path d="M52 152l7-7 7 7-7 7Z" fill="none" stroke="#ff687e" opacity=".8"/><path d="M230 60l7-7 7 7-7 7Z" fill="none" stroke="#a7b4ff" opacity=".8"/></svg></div>
    <div class="menu-actions"><div class="run-label"><span>8 ВОЛН · 2 БОССА</span><span>~ 4 МИНУТЫ</span></div><button id="play" class="primary">ЗАЖЕЧЬ ИСКРУ <span>↗</span></button><div class="secondary-row"><button id="workshop-open" class="secondary">◇ Мастерская <span id="menu-coins">0</span></button><button id="settings-open" class="secondary small" aria-label="Настройки">☷</button><button id="help-open" class="secondary small" aria-label="Как играть">?</button></div></div>
    <footer><span>РЕКОРД <b id="best-score">0</b></span><span>v0.1 · БЕЗ РЕКЛАМЫ</span></footer>
  </main>
  <section id="hud" hidden>
    <div class="hud-top"><div class="wave-tag"><span class="eyebrow">СЕКТОР <span id="sector">01</span></span><b id="wave-text">ВОЛНА 1 / 8</b></div><button id="pause" class="pause-button" aria-label="Пауза"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button></div>
    <div class="health-row"><span class="health-symbol">✚</span><div class="bar"><div id="health-fill"></div></div><b id="health-value">100</b></div>
    <div class="hud-stats"><span id="score">0</span><span id="wave-timer">00:28</span><span id="level">УР. 1</span></div>
    <div class="xp-bar"><div id="xp-fill"></div></div>
    <div id="boss-hud" hidden><span id="boss-name">СТРАЖ ПУСТОТЫ</span><div class="boss-bar"><div id="boss-fill"></div></div></div>
    <div id="combo" hidden></div>
    <div id="control-hint">Двигайся пальцем · стрельба автоматическая</div>
    <div class="bottom-controls"><div class="reactor"><div id="reactor-icon">✦</div><div><b>ИМПУЛЬС</b><span id="energy-label">0 / 100</span><div class="energy-bar"><div id="energy-fill"></div></div></div></div><button id="dash" aria-label="Рывок"><span class="dash-inner"><b>↯</b><span id="dash-label">РЫВОК</span></span></button></div>
  </section>
  <section id="overlay" class="overlay" hidden><div id="panel" class="panel"></div></section>
  <div id="toast" role="status" hidden></div>
  <script src="engine.js"></script><script src="game.js"></script>
</body>
</html>
